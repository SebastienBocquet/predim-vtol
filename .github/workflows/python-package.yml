name: Tests

on:
  push:
    paths-ignore:
      - "*.md"
      - "LICENSE**"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "*.md"
      - "LICENSE**"
      - ".gitignore"

jobs:
  test:
    # Excel (PredimRC) is not available on the runners: its tests skip themselves.
    name: test (${{ matrix.os }}, ${{ matrix.profile.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
        profile:
          - name: full
            tox-env: py312-coverage
          - name: core
            tox-env: core-py312-coverage
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tox
        run: pip install tox-uv
      - name: Run tox
        run: tox run -e ${{ matrix.profile.tox-env }}
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install tox-uv
      - run: tox run -e check
