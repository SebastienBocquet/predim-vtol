id: {definition: "Identifier."}
role (data sheet): {definition: "Use suggested by the manufacturer (lift or cruise).", model: MIC-PROP-MOT}
Kv (rpm/V): {definition: "Speed constant of the motor.", unit: rpm/V, symbol: Kv, model: MIC-PROP-MOT}
