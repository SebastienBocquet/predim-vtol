Pmax (W): {definition: "Maximum power (180 s) of the data sheet.", unit: W, model: MIC-PROP-MOT}
mass (g): {definition: "Mass.", unit: g}
fits unit types: {definition: "Unit types whose power range contains this motor.", model: MIC-CFG-SIZ}

