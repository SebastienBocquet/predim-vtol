# --- cost and reliability (MIC-COST, MIC-REL) ------------------------------------------------
Purchase cost: {definition: "Sum of the priced items: motors, propellers, ESCs, battery, cables, frame and avionics; items without a price are left out and listed.", unit: EUR, model: MIC-COST}
Cost per flight hour: {definition: "Wear cost of one flight (battery, motors, propellers) divided by the flight time at V1.", unit: EUR/h, model: MIC-COST}
Motor-out T/W (worst): {definition: "Smallest remaining thrust-to-weight over the lift motors stopped one at a time; 0 when hover cannot be balanced without one of them (shown in red).", model: MIC-REL}
category: {definition: "Cost category: motors, propellers, ESCs, battery, cables, frame, avionics.", model: MIC-COST}
item: {definition: "Priced component (database id, ESC model, wire gauge...).", model: MIC-COST}
amount: {definition: "Number of items; Wh of nominal energy for the battery; metres of conductor for the cables.", model: MIC-COST}
unit price (EUR): {definition: "Price of one item (per Wh for the battery, per metre for a cable).", unit: EUR, model: MIC-COST}
total (EUR): {definition: "Quantity × unit price; empty when the item has no price.", unit: EUR, model: MIC-COST}
price status: {definition: "verified: read on the product page; search: read in a search result of that page; estimate: database propeller of the same diameter; entered: project; missing: no price.", model: MIC-COST}
price source: {definition: "Page the price was copied from (data/prices.yaml, retrieved 2026-10-18), or the project.", model: MIC-COST}
wear item: {definition: "Component worn by the flights: battery (cycle life), motors (life in hours), propellers (flights between replacements).", model: MIC-COST}
per flight (EUR): {definition: "Wear cost of one flight: battery price / cycles, motor price × flight time / motor life, propeller price / flights.", unit: EUR, model: MIC-COST}
per flight hour (EUR): {definition: "Wear cost per flight hour: per-flight cost / flight time.", unit: EUR/h, model: MIC-COST}
motor stopped: {definition: "Lift motor assumed stopped (motor number).", model: MIC-REL}
hover survives: {definition: "The other lift motors balance the weight, pitch, roll (and yaw unless a motor tilts) within their maximum thrust.", model: MIC-REL}
remaining T/W: {definition: "Thrust-to-weight left with the motor stopped: 1 / max(T_i / T_max,i) of the balanced thrust split; 0 when no balance exists.", model: MIC-REL}
why: {definition: "Reason of the motor-out result.", model: MIC-REL}
price (EUR): {definition: "Price axis.", unit: EUR, model: MIC-COST}

# --- calibration of the two-phase model (MIC-CAL-REF) ----------------------------------------
model before (W): {definition: "Battery power of the model at the measured point before the calibration.", unit: W, model: MIC-CAL-REF}
model after (W): {definition: "Battery power of the model at the measured point with the calibrated factor (equal to the measurement unless the factor is at a bound).", unit: W, model: MIC-CAL-REF}
factor set: {definition: "Model factor set by the point: hover_power_factor (hover point) or drag_factor (cruise point).", model: MIC-CAL-REF}
factor: {definition: "Value of the factor relative to its value before the calibration (1 = no change).", model: MIC-CAL-REF}
note: {definition: "Remark of the calibration: a factor at its bound means the measurement is outside what the model can represent.", model: MIC-CAL-REF}

# --- vertical phases, masses (INC3-006) ---------------------------------------------------------
phase: {definition: "Flight phase: climb to the transition altitude, hover, transition, descent, cruise until the reserve.", model: MIC-MIS-TWO}
climb (W): {definition: "Power of the sink in the climb to the transition altitude.", unit: W, model: MIC-MIS-BUDGET}
climb (%): {definition: "Share of the battery chemical power taken by the sink in the climb.", unit: "%", model: MIC-MIS-BUDGET}
transition (W): {definition: "Power of the sink during the transition (tilting motors at the tilt angle).", unit: W, model: MIC-MIS-BUDGET}
transition (%): {definition: "Share of the battery chemical power taken by the sink during the transition.", unit: "%", model: MIC-MIS-BUDGET}
component: {definition: "Mass component: user item, motor, propeller, ESC, cables, battery.", model: MIC-CFG-MASS}
count: {definition: "Number of items (a tilting motor counts once).", model: MIC-CFG-MASS}
unit mass (g): {definition: "Mass of one item.", unit: g, model: MIC-CFG-MASS}
mass from: {definition: "Where the mass comes from: entered, data sheet of the motor, or computed (cables, battery from its capacity).", model: MIC-CFG-MASS}
conductors: {definition: "Conductors of the cable: 2 for the main and DC cables, 3 for the phase cables.", model: MIC-PROP-CHAIN}
