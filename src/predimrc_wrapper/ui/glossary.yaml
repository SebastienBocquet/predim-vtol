# Displayed quantities of the GUI (REQ-UI-010): KPI tiles, table columns, chart axes.
# Key = the label shown; definition, unit, symbol, model card. The project fields and the
# model ports / parameters get their help from the code (ui/help.py).

# --- two-phase flight time (MIC-MIS-TWO) -------------------------------------------------
V: {definition: "Index of the target speed (1 = minimum aerodynamic power, 2 = maximum L/D by default).", model: MIC-MIS-TWO}
V1: {definition: "Target speed 1: by default the speed of minimum aerodynamic power (best endurance), written into PredimRC Vx 1.", unit: km/h, symbol: V₁, model: MIC-MIS-TWO}
V2: {definition: "Target speed 2: by default the speed of maximum lift-to-drag ratio (best range), written into PredimRC Vx 2.", unit: km/h, symbol: V₂, model: MIC-MIS-TWO}
Flight time: {definition: "Hover time plus cruise time at the target speed until the reserve: t_h + (E_avail − P_h·t_h) / P_c, ± its standard deviation from the surrogate.", unit: min, symbol: t, model: MIC-MIS-TWO}
Range: {definition: "Distance flown in cruise at the target speed: V × cruise time.", unit: km, model: MIC-MIS-TWO}
Hover power (battery): {definition: "Power drawn from the cells in hover: sum of the motor powers (surrogate) plus chain losses and avionics, ± its standard deviation.", unit: W, symbol: P_h, model: MIC-MIS-TWO}
Cruise power (battery): {definition: "Power drawn from the cells in cruise at the target speed: propeller, motor, chain and avionics included.", unit: W, symbol: P_c, model: MIC-MIS-TWO}
Aerodynamic power: {definition: "Drag × speed at the target speed: PredimRC imposed-speed value plus the drag sources (times the drag factor).", unit: W, symbol: D·V, model: MIC-MIS-TWO}
Margin motor power: {definition: "Worst 1 − P / P_max over the motors in hover, climb and cruise (≥ 0 acceptable). Tilt not included: the transition, tilting motors at F / sin θ, has its own margin (Margin transition).", model: MIC-MIS-TWO}
Margin motor current: {definition: "Worst 1 − I_motor / I_max over the motors in hover, climb and cruise (≥ 0 acceptable). Tilt not included: see Margin transition.", model: MIC-MIS-TWO}
Margin hover thrust within test data: {definition: "Worst 1 − T / T_max,test over the lift motors in hover, climb and transition (tilt included: the tilting motors at F / sin θ): how far the operating thrust is from the largest thrust measured in the test table; negative means the surrogate extrapolates beyond the data (NaN without data). Data coverage, not control.", model: MIC-MIS-TWO}
Margin thrust-to-weight (control): {definition: "(T/W reachable at full throttle by the lift motors, motor model at the nominal voltage, keeping the hover split) / T/W_min − 1: the control authority left in hover (≥ 0 acceptable). Tilt not included: all motors vertical, and the full-throttle thrust comes from the motor model (current, power, voltage limits), not from the test tables, so it can be negative while every motor shows a positive power or current margin at its hover thrust. Per motor: the 'margin with T/W min (motor limits)' column of the hover table.", model: MIC-MIS-TWO}
Margin transition (tilting motors): {definition: "Worst min(power margin, current margin) of the motors during the transition, the tilting motors giving F / sin θ (tilt included; NaN without transition). These motors are the transition rows of the hover table in Results.", model: MIC-MIS-TWO}
Margin yaw tilt (worst case): {definition: "Worst min(power margin, current margin) of the yaw-tilting motors in the yaw worst case (Mission tab: yaw tilt front or rear): transition tilt θ (if any) and maximum yaw tilt δ. Front motors (differential tilt, same axis as the transition): one side at θ − δ (vertical component k = sin(θ − δ)), the other at θ + δ, then the reverse; rear rotor (tricopter, lateral tilt, orthogonal axis): k = sin θ · cos δ (θ = 90° for a motor that does not tilt for the transition). Each motor keeps its hover share F of the vertical force: T = F / k. Short manoeuvre: not counted in the energy. Worst-case rows of the hover table in Results (NaN without yaw tilt).", model: MIC-MIS-TWO}
Margin battery c: {definition: "1 − battery current / maximum continuous current (C rate) at the most demanding phase, transition included (tilt included).", model: MIC-PROP-BAT}
Margin mass: {definition: "1 − total mass / maximum take-off mass (NaN when no maximum is set).", model: MIC-CFG-MASS}
Margin voltage: {definition: "1 − motor voltage / (maximum duty × battery voltage), scenario mode.", model: MIC-MIS-SEG}
Total mass: {definition: "Sum of the mass items, propulsion units and battery.", unit: kg, symbol: m, model: MIC-CFG-MASS}
Best-endurance speed: {definition: "Speed of minimum battery power, scenario mode.", unit: km/h, symbol: V_e, model: MIC-MIS-SOL}
Best-range speed: {definition: "Speed of minimum battery energy per distance, scenario mode.", unit: km/h, symbol: V_r, model: MIC-MIS-SOL}
max_sd_rel: {definition: "Largest relative standard deviation of the hover power of a motor (surrogate uncertainty); constrained ≤ 5 % when asked.", model: MIC-PROP-SUR}
tilts: {definition: "The motor tilts: it lifts in hover and pushes in cruise (role tilt, ArduPilot Q_TILT_MASK); it counts once in the mass.", model: MIC-MIS-TWO}

# --- hover table (MIC-MIS-TWO, MIC-PROP-SUR) ------------------------------------------------
motor: {definition: "Motor number: position in the motor list (ArduPilot output order).", model: MIC-MIS-TWO}
unit: {definition: "Propulsion unit type of the motor (motor, propeller, ESC).", model: MIC-PROP-UNIT}
pair (data): {definition: "Motor + propeller pair whose test data feed the surrogate; 'not in the database' for an untested propeller.", model: MIC-PROP-SUR}
pair: {definition: "Motor + propeller pair of the test data.", model: MIC-PROP-SUR}
thrust: {definition: "Thrust of one motor (hover: from the balance of forces and moments; cruise: drag shared by the cruise motors; or test point), in N with the equivalent mass in kg (T / g) in parentheses.", unit: N (kg), model: MIC-MIS-TWO}
thrust (N): {definition: "Thrust of one motor (chart axis); the hover text gives the equivalent mass in kg.", unit: N, model: MIC-MIS-TWO}
share (%): {definition: "Share of the total hover thrust carried by the motor (force and moment balance about the CG).", unit: "%", model: MIC-MIS-TWO}
power (W): {definition: "Electric power of the motor at its thrust, at the measurement point of the data (surrogate prediction or test point).", unit: W, model: MIC-PROP-SUR}
± σ (W): {definition: "Standard deviation of the surrogate power prediction (95 % interval ≈ ±1.96 σ).", unit: W, model: MIC-PROP-SUR}
measured at: {definition: "Electrical point where the test power is measured: motor_input (ESC and cables added by the chain) or esc_input (table names its ESC).", model: MIC-PROP-CHAIN}
motor current (A): {definition: "Motor (phase-side) current, from R·I² + (ω/Kv)·I − P = 0; larger than the supply current at part throttle.", unit: A, model: MIC-PROP-MOT}
rpm: {definition: "Rotation speed of the propeller.", unit: rpm}
power margin: {definition: "1 − P / P_max of the motor at the thrust of its row (a transition row: tilting motor at F / sin θ). No safety factor: see the 'with T/W min' columns.", model: MIC-PROP-MOT}
current margin: {definition: "1 − I_motor / I_max of the motor at the thrust of its row (a transition row: tilting motor at F / sin θ). No safety factor: see the 'with T/W min' columns.", model: MIC-PROP-MOT}
thrust margin: {definition: "1 − T / T_max of the tested pair (largest thrust of its table), at the thrust of its row (a transition row: tilting motor at F / sin θ). No safety factor: see the 'with T/W min' columns.", model: MIC-PROP-SUR}
thrust with T/W min: {definition: "T_safety, thrust the motor must deliver with the safety factor: T/W_min (minimum thrust-to-weight, Mission tab) × its share × m·g (a transition row: divided by sin θ).", unit: N (kg), model: MIC-MIS-TWO}
margin with T/W min (motor limits): {definition: "T_full throttle / T_safety − 1: thrust left at full throttle (motor model at the nominal voltage: current, power and voltage limits) once the safety factor T/W_min is applied (≥ 0 acceptable). The worst hover row is the 'Margin thrust-to-weight (control)' tile.", model: MIC-MIS-TWO}
margin with T/W min (test data): {definition: "1 − T_safety / T_max,test: the thrust with the safety factor T/W_min against the largest thrust measured for the pair; negative means that thrust is beyond the test data (NaN without data).", model: MIC-PROP-SUR}
motor current with T/W min (A): {definition: "I_safety, motor current at T_safety (thrust with the safety factor T/W_min), from the thrust-power surrogate at the bus voltage of the row; no climb factor. Beyond the test data it is extrapolated: see the 'margin with T/W min (test data)' column.", unit: A, model: MIC-MIS-TWO}
current margin with T/W min: {definition: "1 − I_safety / I_max of the motor: current left at the thrust with the safety factor T/W_min (≥ 0 acceptable).", model: MIC-MIS-TWO}
source: {definition: "Origin of the value: tested_pair (test data of this pair), untested_pair (predicted from similar pairs), physics_only (no data); or URL of a data source.", model: MIC-PROP-SUR}
trusted: {definition: "The prediction is inside the trusted domain: σ_rel ≤ 5 % and thrust within the tested range.", model: MIC-PROP-SUR}
why not: {definition: "Reason why a prediction is not trusted.", model: MIC-PROP-SUR}

# --- cruise table ---------------------------------------------------------------------------
speed (km/h): {definition: "Airspeed.", unit: km/h}
prop efficiency: {definition: "Propeller efficiency T·V / P_shaft at the operating point (blade-element model).", model: MIC-PROP-BEM}
motor input (W): {definition: "Electric power at the motor input.", unit: W, model: MIC-PROP-MOT}
aero power (W): {definition: "Drag × speed at the target speed (PredimRC + drag sources).", unit: W, model: MIC-MIS-TWO}
battery power (W): {definition: "Power drawn from the cells.", unit: W, model: MIC-PROP-CHAIN}
model: {definition: "Model used for this value or this drag source."}

# --- power chain (MIC-PROP-CHAIN) -------------------------------------------------------------
segment: {definition: "Segment of the power chain (battery, main cable, DC cable, ESC, phase cables) or of the mission.", model: MIC-PROP-CHAIN}
hover loss (W): {definition: "Power lost in the segment in hover.", unit: W, model: MIC-PROP-CHAIN}
V1 loss (W): {definition: "Power lost in the segment in cruise at V1.", unit: W, model: MIC-PROP-CHAIN}
V2 loss (W): {definition: "Power lost in the segment in cruise at V2.", unit: W, model: MIC-PROP-CHAIN}
in the data: {definition: "The loss is inside the test data (ESC of a table measured at the ESC input): shown, not added.", model: MIC-PROP-CHAIN}
ESC x (mm): {definition: "Station of the ESC from its position in % of the fuselage or arm length.", unit: mm, model: MIC-PROP-CHAIN}
ESC y (mm): {definition: "Lateral position of the ESC.", unit: mm, model: MIC-PROP-CHAIN}
DC cable (mm): {definition: "Length of the DC cable from the distribution point to the ESC (2 conductors); 0 for a 4-in-1 board.", unit: mm, model: MIC-PROP-CHAIN}
phase cable (mm): {definition: "Length of the phase cables from the ESC to the motor (3 conductors).", unit: mm, model: MIC-PROP-CHAIN}
ESC position: {definition: "How the ESC position was obtained (4-in-1, separate at % of fuselage or arm).", model: MIC-PROP-CHAIN}

# --- drag (MIC-CFG-DRAG) -----------------------------------------------------------------------
kind: {definition: "Kind of drag source (boom, stopped rotor, V-arms, body part, free CdS) or of study.", model: MIC-CFG-DRAG}
formula: {definition: "Formula of the drag model with its coefficients.", model: MIC-CFG-DRAG}
blade_position: {definition: "Position of the stopped blades in cruise: aligned with the flow (best case, C_d,b 0.015), across the flow (worst case, C_d,b 0.15: sections at their pitch angle) or random stop (mean, 0.0825).", model: MIC-CFG-DRAG}
frontal area (dm²): {definition: "Area seen by the flow; V-arms: Σ t·L·√(1 − u_x²) from the geometry unless entered.", unit: dm², model: MIC-CFG-DRAG}
area from: {definition: "Origin of the frontal area: geometry or user.", model: MIC-CFG-DRAG}
C_d: {definition: "Drag coefficient of the shape, referred to the frontal area (PredimRC accessory shapes).", model: MIC-CFG-DRAG}
CdS (dm²): {definition: "Drag area of the source (drag = ½ρV²·CdS).", unit: dm², model: MIC-CFG-DRAG}
coefficient source: {definition: "Where the drag coefficient comes from (PredimRC cell, literature).", model: MIC-CFG-DRAG}
drag power at V1 (W): {definition: "Power absorbed by the source at V1: ½ρV₁³·CdS.", unit: W, model: MIC-CFG-DRAG}

# --- cruise tab (PredimRC) -----------------------------------------------------------------------
block: {definition: "PredimRC block of the result (Aile, Réglages, Performances)."}
quantity: {definition: "Name of the quantity."}
value: {definition: "Value of the quantity."}
description: {definition: "Description of the quantity, from the PredimRC cell comment."}
Vx (km/h): {definition: "Horizontal speed, PredimRC unit.", unit: km/h}
Vz (m/s): {definition: "Vertical speed in glide (negative when sinking), PredimRC palier block.", unit: m/s}
Cz: {definition: "Wing lift coefficient.", symbol: C_z}
Cz / Cx: {definition: "Lift-to-drag ratio (finesse).", symbol: L/D}
Finesse (Cz / Cx): {definition: "Lift-to-drag ratio at the imposed speed versus Cz.", symbol: L/D}
Puissance aéro (W): {definition: "PredimRC aerodynamic power at the imposed speed versus Cz (drag × speed).", unit: W}
aerodynamic power (W): {definition: "Drag × speed: PredimRC column P (W), drag sources ½ρV³ΣCdS, and their total.", unit: W, model: MIC-CFG-DRAG}

# --- hover test data and surrogate validation (MIC-PROP-SUR) --------------------------------------
test: {definition: "Identifier of the test table (motor__propeller__voltage).", model: MIC-PROP-SUR}
throttle (%): {definition: "Throttle of the test point.", unit: "%"}
voltage (V): {definition: "Supply voltage of the test.", unit: V}
current (A): {definition: "Current drawn from the supply (DC side, power = voltage × current).", unit: A}
points: {definition: "Number of points."}
ESC: {definition: "ESC named by the test table (none: power measured at the motor input).", model: MIC-PROP-CHAIN}
propeller: {definition: "Propeller id of the database."}
pairs: {definition: "Number of tested motor + propeller pairs."}
LOO mean error (%): {definition: "Leave-one-out: mean relative error of the power predicted at a test point fitted without it.", unit: "%", model: MIC-PROP-SUR}
LOO max error (%): {definition: "Leave-one-out: largest relative error.", unit: "%", model: MIC-PROP-SUR}
LOO coverage 95 % (%): {definition: "Share of the test points inside the 95 % interval predicted without them (guarantee: 90–99 %).", unit: "%", model: MIC-PROP-SUR}
leave-one-pair-out mean error (%): {definition: "Mean relative error on a pair fitted without any of its points (prediction of untested pairs).", unit: "%", model: MIC-PROP-SUR}
leave-one-pair-out coverage 95 % (%): {definition: "Share of the points of a left-out pair inside the 95 % interval.", unit: "%", model: MIC-PROP-SUR}
physics mean error (%): {definition: "Mean relative error of the physics model alone (blade elements + motor constants).", unit: "%", model: MIC-PROP-SUR}
guarantee met: {definition: "LOO mean error ≤ 3 % and LOO coverage within 90–99 %.", model: MIC-PROP-SUR}
data hash: {definition: "Content hash of the test data the surrogate was fitted on."}

# --- propeller sizing (MIC-PROP-BEM) ----------------------------------------------------------------
pitch (in): {definition: "Geometric pitch of the propeller.", unit: in, model: MIC-PROP-BEM}
current: {definition: "The pitch of the project."}
η prop × motor V1: {definition: "Propeller × motor efficiency T·V / P_el at V1 (thrust of the result).", model: MIC-PROP-BEM}
η prop × motor V2: {definition: "Propeller × motor efficiency T·V / P_el at V2.", model: MIC-PROP-BEM}
η propeller V1: {definition: "Propeller efficiency T·V / P_shaft at V1.", model: MIC-PROP-BEM}
η propeller V2: {definition: "Propeller efficiency T·V / P_shaft at V2.", model: MIC-PROP-BEM}
rpm V1: {definition: "Rotation speed giving the thrust at V1.", unit: rpm, model: MIC-PROP-BEM}
rpm V2: {definition: "Rotation speed giving the thrust at V2.", unit: rpm, model: MIC-PROP-BEM}
within limits V1: {definition: "Motor current, power and voltage within limits at V1.", model: MIC-PROP-MOT}
within limits V2: {definition: "Motor current, power and voltage within limits at V2.", model: MIC-PROP-MOT}
hover electric power (W): {definition: "Electric power of a tilting motor in hover with this pitch.", unit: W, model: MIC-PROP-BEM}
hover within limits: {definition: "Motor within limits in hover with this pitch.", model: MIC-PROP-MOT}
best pitch V1 (in): {definition: "Pitch of highest propeller × motor efficiency at V1 within the motor limits.", unit: in, model: MIC-PROP-BEM}
best pitch V2 (in): {definition: "Pitch of highest propeller × motor efficiency at V2 within the motor limits.", unit: in, model: MIC-PROP-BEM}
best compromise V1 + V2 (in): {definition: "Pitch of highest mean efficiency at V1 and V2, within limits at both.", unit: in, model: MIC-PROP-BEM}
best hover pitch (in): {definition: "Pitch needing the least electric power in hover (tilting unit).", unit: in, model: MIC-PROP-BEM}
hover penalty of the compromise (%): {definition: "Extra hover power of the cruise compromise pitch versus the best hover pitch.", unit: "%", model: MIC-PROP-BEM}
FM: {definition: "Figure of merit in hover: ideal momentum power / shaft power.", model: MIC-PROP-BEM}
shaft power (W): {definition: "Mechanical power on the propeller shaft.", unit: W, model: MIC-PROP-BEM}
electric power (W): {definition: "Electric power at the motor input.", unit: W, model: MIC-PROP-MOT}
within motor limits: {definition: "Motor current, power and voltage within limits.", model: MIC-PROP-MOT}

# --- test data (REQ-DATA-006) -----------------------------------------------------------------------
point: {definition: "Number of the measured flight point."}
date: {definition: "Date of the flight or of the study."}
mass (kg): {definition: "Mass during the measurement (project mass when not given).", unit: kg}
measured (W): {definition: "Measured battery power.", unit: W}
model (W): {definition: "Battery power of the two-phase model at the conditions of the point (uncalibrated).", unit: W, model: MIC-MIS-TWO}
deviation (%): {definition: "Model / measured − 1.", unit: "%"}
inside the 95 % band: {definition: "The measurement lies within the 95 % interval of the model (hover).", model: MIC-PROP-SUR}
error: {definition: "Error message of a point that could not be evaluated."}

