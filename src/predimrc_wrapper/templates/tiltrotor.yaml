# Template tricopter with wing (tilt-rotor VTOL): wing of the quadplane template, two front
# motors and one rear motor; the tilt mask (roles) chooses which ones tilt (default: the two front
# ones, lift in hover and thrust in cruise; the rear one lifts and stops in cruise).
# CG = PredimRC CG for the 5 % static margin of this wing; the rear motor sits on a tail boom
# far enough aft (600 mm) to carry a third of the weight with the same motor as the front.
# Illustrative masses.
format_version: 2
name: tricopter_wing_tilt
architecture: quadplane
aero:
  profile: SD7003
  wing:
    root_chord_mm: 200
    tip_chord_mm: [200, 185, 140, 50]
    length_mm: [285, 300, 180, 105]
    le_offset_mm: [0, 7, 40, 150]
    twist_deg: [0, 0, 0, 0]
    dihedral_deg: [0, 1, 1, 20]
  stab:
    root_chord_mm: 140
    tip_chord_mm: [100]
    length_mm: [320]
    le_offset_mm: [170]
    lever_mm: 360
    height_mm: 0
    profile: Biconvexe fin
    opening: "120"
    lateral_gap_mm: 20
  fuselage:
    length_mm: 760
    width_mm: 85
    height_mm: 115
    nose_lever_mm: 270
    shape: Profilée
    beam: Normale
    wing_pos: médiane
    incidence: aile
  static_margin_pct: 5
  cz_reg: 0.3
propulsion_units:
  front:
    motor_id: tmotor-mn2806-650kv
    prop_diameter_in: 12
    prop_pitch_in: 6
    prop_mass_g: 20
    esc_mass_g: 25
  rear:
    motor_id: tmotor-mn2806-650kv
    propeller_id: tmotor-p12x4
    prop_diameter_in: 12
    prop_pitch_in: 4
    prop_mass_g: 20
    esc_mass_g: 25
# Front motors on short booms ahead of the wing; rear motor on a tail boom behind the fuselage.
motors:
  - {unit: front, role: tilt, x_mm: -200.0, y_mm: 300.0}
  - {unit: front, role: tilt, x_mm: -200.0, y_mm: -300.0}
  - {unit: rear, role: lift, x_mm: 600.0, y_mm: 0.0}
cg_x_mm: 66.6  # PredimRC CG for the 5 % static margin of this wing (3-Geometrie!D30)
battery:
  chemistry: li-ion
  n_series: 4
  mode: mass
  mass_g: 380  # 450 g before the cables entered the mass budget (2026-10-19)
mass_items:
  - {name: airframe, category: airframe, mass_g: 750}
  - {name: tilt servos and mounts, category: vtol_structure, mass_g: 120}
  - {name: camera, category: payload, mass_g: 150}
  - {name: "flight controller, GPS, receiver", category: avionics, mass_g: 120}
booms: {layout: parallel, section: round, thickness_mm: 16}
drag_sources:
  - {name: stopped rear propeller, kind: stopped_rotor, count: 1, n_blades: 2, blade_chord_mm: 25, radius_mm: 152}
max_takeoff_mass_kg: 3.0
sizing:
  target_mass_kg: [1.8, 2.4]
