# Template tricopter with wing (tilt-rotor VTOL): wing of the quadplane template, two tilting
# front motors (lift in hover, thrust in cruise) and one rear lift motor stopped in cruise. Illustrative masses.
format_version: 2
name: tricopter_wing_tilt
architecture: quadplane
aero:
  profile: SD7003
  wing:
    root_chord_mm: 200
    tip_chord_mm: [200, 185, 140, 50]
    length_mm: [285, 300, 180, 105]
    le_offset_mm: [0, 7, 40, 150]
    twist_deg: [0, 0, 0, 0]
    dihedral_deg: [0, 1, 1, 20]
  stab:
    root_chord_mm: 140
    tip_chord_mm: [100]
    length_mm: [320]
    le_offset_mm: [170]
    lever_mm: 360
    height_mm: 0
    profile: Biconvexe fin
    opening: "120"
    lateral_gap_mm: 20
  fuselage:
    length_mm: 760
    width_mm: 85
    height_mm: 115
    nose_lever_mm: 270
    shape: Profilée
    beam: Normale
    wing_pos: médiane
    incidence: aile
  static_margin_pct: 5
  cz_reg: 0.3
propulsion_units:
  tilt:
    motor_id: tmotor-mn2806-650kv
    prop_diameter_in: 12
    prop_pitch_in: 6
    prop_mass_g: 20
    esc_mass_g: 25
  rear:
    motor_id: tmotor-mn2212-780kv
    prop_diameter_in: 10
    prop_pitch_in: 4.5
    prop_mass_g: 15
    esc_mass_g: 20
# Tilting motors on short booms ahead of the wing; rear motor on the tail boom.
motors:
  - {unit: tilt, role: tilt, x_mm: -200.0, y_mm: 300.0}
  - {unit: tilt, role: tilt, x_mm: -200.0, y_mm: -300.0}
  - {unit: rear, role: lift, x_mm: 450.0, y_mm: 0.0}
cg_x_mm: 20
battery:
  chemistry: li-ion
  n_series: 4
  mode: mass
  mass_g: 450
mass_items:
  - {name: airframe, category: airframe, mass_g: 750}
  - {name: tilt servos and mounts, category: vtol_structure, mass_g: 120}
  - {name: camera, category: payload, mass_g: 150}
  - {name: "flight controller, GPS, receiver", category: avionics, mass_g: 120}
booms: {layout: parallel, section: round, thickness_mm: 16}
drag_sources:
  - {name: stopped rear propeller, kind: stopped_rotor, count: 1, n_blades: 2, blade_chord_mm: 22, radius_mm: 127}
max_takeoff_mass_kg: 3.0
sizing:
  target_mass_kg: [1.8, 2.4]
scenarios:
  hover_90s:
    segments:
      - {kind: vertical_climb, altitude_change_m: 30, vertical_speed_m_s: 2.0}
      - {kind: hover, duration_s: 90}
      - {kind: transition, duration_s: 15}
      - {kind: cruise, until_reserve: true, speed: optimal_range}
      - {kind: transition, duration_s: 15}
      - {kind: vertical_descent, altitude_change_m: -30, vertical_speed_m_s: 1.5}
