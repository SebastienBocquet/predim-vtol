# Template tricopter: reference aircraft of 1870 g, 12 in propellers at the front, 10 in at
# the rear, 280 W measured in hover. Masses are illustrative values adding up to 1870 g
# with the cables computed from the power chain (38.3 g, wiring).
format_version: 2
name: tricopter
architecture: multicopter
# Cruise drag of the body: C_d of the shape (PredimRC Non profilé = 1.0) × frontal area.
body_shape: Non profilé
body_frontal_area_dm2: 2.5
propulsion_units:
  front:
    motor_id: tmotor-mn2806-650kv
    prop_diameter_in: 12
    prop_pitch_in: 4.0
    prop_mass_g: 20
    esc_mass_g: 20
  rear:
    motor_id: tmotor-mn2212-780kv
    prop_diameter_in: 10
    prop_pitch_in: 4.5
    prop_mass_g: 15
    esc_mass_g: 20
# Front arms at ±60° from the nose, rear arm on the centreline (yaw by tilting the rear motor).
motors:
  - {unit: front, role: lift, x_mm: -150.0, y_mm: 259.8}
  - {unit: front, role: lift, x_mm: -150.0, y_mm: -259.8}
  - {unit: rear, role: lift, x_mm: 300.0, y_mm: 0.0}
cg_x_mm: 0
battery:
  chemistry: lipo
  n_series: 4
  mode: mass
  mass_g: 450
mass_items:
  - {name: frame, category: airframe, mass_g: 561.7}
  - {name: tail servo and tilt mechanism, category: airframe, mass_g: 100}
  - {name: camera, category: payload, mass_g: 300}
  - {name: "flight controller, GPS, receiver", category: avionics, mass_g: 148}
sizing:
  target_mass_kg: [1.7, 2.0]
calibration:
  hover: {battery_power_w: 280, mass_kg: 1.87}
