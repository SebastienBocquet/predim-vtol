[project]
name = "predimrc_wrapper"
authors = [
    {name = "Sebastien Bocquet", email = "sbocquet@gmail.com"}
]
description = "A Python wrapper of PredimRC."
readme = "README.md"
license = "LGPL-3.0"
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dynamic = ["version"]
requires-python = ">=3.10, <3.13"
dependencies = [
    "xlwings >=0.30; sys_platform == 'win32'",
    "numpy",
    "scipy",
    "pyyaml",
    "pydantic >=2",
    "scikit-learn >=1.3",
    "joblib",
]

[project.optional-dependencies]
mdo = ["gemseo[all] >=6"]
ui = ["streamlit", "plotly"]

[project.scripts]
predimrc-ui = "predimrc_wrapper.ui.cli:main"

[dependency-groups]
dev = [
    "covdefaults >=2",
    "pytest >=7,<9",
    "pytest-cov >=5",
    "pytest-xdist >=3",
]
doc = [
    "black",
    "griffe-fieldz",
    "griffe-inherited-docstrings",
    "markdown-exec[ansi]",
    "mike",
    "mkdocs-bibtex",
    "mkdocs-gallery",
    "mkdocs-gen-files",
    "mkdocs-include-markdown-plugin",
    "mkdocs-literate-nav",
    "mkdocs-material",
    "mkdocs-section-index",
    "mkdocstrings[python]",
    "mkdocs-table-reader-plugin",
    "mkdocs-exclude",
    "mkdocs-autorefs",
]

[build-system]
requires = [
    "setuptools",
    "setuptools_scm[toml]",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.1.0.dev0"

[tool.setuptools.package-data]
predimrc_wrapper = ["data/*.yaml", "data/*.md", "data/thrust_tests/*.yaml", "templates/*.yaml", "ui/*.yaml"]

[tool.pytest.ini_options]
# show extra info on xfailed, xpassed, and skipped tests
#addopts = "--disable-pytest-warnings -rxs"
testpaths = ["tests"]
markers = [
    "fast: mark a test as running fast (a few seconds).",
    "medium_slow: mark a test as taking a few minutes to run.",
    "slow: mark a test as taking more than 15 min and less than one hour.",
    "very_slow: mark a test as taking more than one hour to run.",
]
