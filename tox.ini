[tox]
min_version = 4
requires = tox-uv

[testenv]
package = editable
# The complete suite (every extra) is the default: `tox run -e py312`.
# The mandatory-deps-only profile is opt-in via the `core` factor: `tox run -e core-py312`.
# Tests driving Excel (PredimRC) skip themselves when Excel is not available.
deps =
    !core: {env:TOX_TESTENV_DEPS:-r requirements/test-full-python{py_dot_ver}.txt}
    core: {env:TOX_TESTENV_DEPS:-r requirements/test-python{py_dot_ver}.txt}
set_env =
    MPLBACKEND = AGG
    coverage: __COVERAGE_POSARGS=--cov --cov-report=xml --cov-report=html --no-cov-on-fail
commands =
    pytest {env:__COVERAGE_POSARGS:} {posargs}

[testenv:check]
description = run code formatting and checking
basepython = python3.12
deps = -r requirements/check.txt
skip_install = true
allowlist_externals = pre-commit
commands =
    pre-commit install
    pre-commit run --all-files

[testenv:dist]
description = create and check the distribution
deps =
    check-wheel-contents
    uv
skip_install = true
allowlist_externals = rm
commands =
    rm -rf dist build
    uv build
    check-wheel-contents dist --ignore W002

[testenv:update-deps]
description = update the envs dependencies
set_env =
    __command = uv pip compile pyproject.toml --upgrade --universal
deps =
    pre-commit
    uv
skip_install = true
commands =
    {env:__command} --group dev --python-version 3.10 -o requirements/test-python3.10.txt
    {env:__command} --group dev --python-version 3.11 -o requirements/test-python3.11.txt
    {env:__command} --group dev --python-version 3.12 -o requirements/test-python3.12.txt
    {env:__command} --all-extras --group dev --python-version 3.10 -o requirements/test-full-python3.10.txt
    {env:__command} --all-extras --group dev --python-version 3.11 -o requirements/test-full-python3.11.txt
    {env:__command} --all-extras --group dev --python-version 3.12 -o requirements/test-full-python3.12.txt
    uv pip compile --upgrade --universal --python-version 3.12 -o requirements/check.txt requirements/check.in
    pre-commit autoupdate
